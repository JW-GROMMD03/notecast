<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NoteCast Capture</title>
  <style>
    body { width: 280px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; margin: 0; background: #0f172a; color: #f8fafc; }
    .popup-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .popup-header img { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; }
    h2 { font-size: 16px; margin: 0; color: #38bdf8; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.4; margin-bottom: 16px; }
    button { width: 100%; background: #0284c7; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .error { color: #f43f5e; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="popup-header">
    <img src="icons/icon.png" alt="NoteCast Logo">
    <h2>NoteCast Live Studio</h2>
  </div>
  <p id="statusMsg">Click below to authorize and start capturing this YouTube tab.</p>
  <button id="launchBtn">Start NoteCast Capture</button>
  <div id="errorMsg" class="error"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
