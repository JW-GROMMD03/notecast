<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Interactive Simulator — NoteCast</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="stylesheet" href="styles.css">
<style>
  body { overflow: hidden; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #070a14;}
  .sim-header { background: rgba(7, 10, 20, 0.9); backdrop-filter: blur(10px); padding: 16px 24px; border-bottom: 1px solid var(--border-color, #1e293b); display: flex; justify-content: space-between; align-items: center; z-index: 10;}
  .sim-container { display: flex; flex: 1; overflow: hidden; }
  
  /* Canvas Area */
  .canvas-pane { flex: 3; background: #0f172a; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  
  /* Control Panel */
  .control-pane { flex: 1; background: #070a14; border-left: 1px solid var(--border-color, #1e293b); padding: 32px 24px; overflow-y: auto; box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
  
  .control-group { margin-bottom: 28px; }
  .control-group label { display: flex; justify-content: space-between; color: var(--text-muted, #94a3b8); font-size: 0.9rem; margin-bottom: 12px; font-weight: 600;}
  .control-group input[type="range"] { 
    width: 100%; cursor: pointer; accent-color: #3b82f6; height: 6px; background: #1e293b; border-radius: 4px; outline: none;
  }
  
  .metric-box { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); padding: 20px; border-radius: 12px; margin-bottom: 24px; text-align: center; }
  .metric-value { font-size: 2.2rem; font-weight: 900; color: #3b82f6; font-family: monospace; }
  
  .btn-outline {
    background: transparent; color: #f8fafc; border: 1px solid var(--border-color, #1e293b); padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; text-decoration: none; transition: all 0.2s;
  }
  .btn-outline:hover { border-color: #ef4444; color: #ef4444; }
</style>
</head>
<body>

  <header class="sim-header">
    <div class="brand">
      <img src="assets/icon.png" alt="Logo" style="width: 28px; height: 28px; border-radius: 6px; vertical-align: middle; margin-right: 10px;">
      <span class="brand-name" id="headerTitle" style="font-weight: 800; color: #fff;">NoteCast Simulator</span>
    </div>
    <a href="dashboard.html" class="btn-outline">Exit Simulator</a>
  </header>

  <div class="sim-container">
    <!-- Living Diagram Canvas -->
    <div class="canvas-pane" id="canvasContainer">
      <canvas id="simCanvas"></canvas>
    </div>

    <!-- Dynamic Parameter Tuning Panel -->
    <div class="control-pane">
      <h2 id="simHeading" style="margin-top: 0; color: #fff; font-size: 1.4rem;">Loading Environment...</h2>
      <p id="simDesc" style="color: var(--text-muted, #94a3b8); font-size: 0.9rem; margin-bottom: 32px; line-height: 1.5;">
        Please wait while the AI generates the physical nodes, connectors, and parameters for your topic.
      </p>

      <div class="metric-box">
        <div style="font-size: 0.85rem; color: #60a5fa; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">System Cycles</div>
        <div class="metric-value" id="cycleMetric">0</div>
      </div>

      <!-- AI will inject sliders here -->
      <div id="controlsContainer"></div>
    </div>
  </div>

  <script type="module" src="simulator.js"></script>
</body>
</html>
