<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 3D Interactive Simulator — NoteCast</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="stylesheet" href="styles.css">
<!-- Three.js 3D Engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  body { overflow: hidden; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #070a14;}
  .sim-header { background: rgba(7, 10, 20, 0.9); backdrop-filter: blur(10px); padding: 16px 24px; border-bottom: 1px solid var(--border-color, #1e293b); display: flex; justify-content: space-between; align-items: center; z-index: 10;}
  .sim-container { display: flex; flex: 1; overflow: hidden; position: relative; }
  
  /* Left: In-Depth Lecture Panel */
  .explanation-pane { flex: 1.2; background: #0b0f19; border-right: 1px solid var(--border-color, #1e293b); padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; max-width: 450px; z-index: 5; }
  .tts-controls { background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 10px; padding: 14px; }
  .explain-box { background: var(--bg-card, #0f172a); border: 1px solid var(--border-color, #1e293b); border-radius: 10px; padding: 20px; flex: 1; font-size: 0.95rem; line-height: 1.8; color: var(--text-main, #f8fafc); overflow-y: auto; font-family: Georgia, serif; }

  /* Center: 3D Canvas Area */
  .canvas-pane { flex: 2; background: #000; position: relative; display: flex; flex-direction: column; cursor: grab; }
  .canvas-pane:active { cursor: grabbing; }
  #simCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; outline: none; }
  
  /* 3D Label Overlays */
  #labelsContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  .node-label { position: absolute; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; font-family: sans-serif; transform: translate(-50%, -50%); transition: opacity 0.1s; backdrop-filter: blur(4px); }

  /* Right: Dynamic Parameter Tuning Panel */
  .control-pane { flex: 1; background: #070a14; border-left: 1px solid var(--border-color, #1e293b); padding: 24px; overflow-y: auto; box-shadow: -10px 0 30px rgba(0,0,0,0.5); max-width: 350px; z-index: 5;}
  
  .control-group { margin-bottom: 24px; }
  .control-group label { display: flex; justify-content: space-between; color: var(--text-muted, #94a3b8); font-size: 0.9rem; margin-bottom: 8px; font-weight: 600;}
  .control-group input[type="range"] { width: 100%; cursor: pointer; accent-color: #3b82f6; height: 6px; background: #1e293b; border-radius: 4px; outline: none; }
  .control-group select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #3b82f6; color: white; border-radius: 6px; outline: none; cursor: pointer; font-size: 0.9rem; }
  
  .metric-box { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); padding: 16px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
  .metric-value { font-size: 2rem; font-weight: 900; color: #3b82f6; font-family: monospace; }
  
  .btn-outline { background: transparent; color: #f8fafc; border: 1px solid var(--border-color, #1e293b); padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; text-decoration: none; transition: all 0.2s; }
  .btn-outline:hover { border-color: #ef4444; color: #ef4444; }
  .btn-action { background: #3b82f6; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

  <header class="sim-header">
    <div class="brand">
      <img src="assets/icon.png" alt="Logo" style="width: 28px; height: 28px; border-radius: 6px; vertical-align: middle; margin-right: 10px;">
      <span class="brand-name" id="headerTitle" style="font-weight: 800; color: #fff;">3D Knowledge Simulator</span>
    </div>
    <a href="dashboard.html" class="btn-outline">Exit Simulator</a>
  </header>

  <div class="sim-container">
    <!-- Left: Detailed Lecture Panel -->
    <div class="explanation-pane">
      <h3 style="margin: 0; color: #fff; font-size: 1.1rem;">🎓 Comprehensive Lecture Notes</h3>
      <div class="tts-controls">
        <label style="font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 6px;">Voice Narrator:</label>
        <select id="voiceSelect" style="width: 100%; padding: 8px; background: #070a14; border: 1px solid #1e293b; color: #fff; border-radius: 6px; margin-bottom: 10px; font-size: 0.85rem;"></select>
        <div style="display: flex; gap: 8px;">
          <button id="speakBtn" class="btn-action" style="flex: 1; font-size: 0.8rem;">🔊 Read Lecture</button>
          <button id="stopSpeakBtn" class="btn-outline" style="flex: 1; font-size: 0.8rem;">⏹️ Stop</button>
        </div>
      </div>
      <div class="explain-box" id="explanationText">
        Loading degree-level academic analysis...
      </div>
    </div>

    <!-- Center: 3D WebGL Canvas -->
    <div class="canvas-pane" id="canvasContainer">
      <div id="labelsContainer"></div>
      <canvas id="simCanvas"></canvas>
      <div style="position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); font-size: 0.8rem; pointer-events: none;">
        Left Click: Rotate 3D | Scroll: Zoom | Right Click: Pan
      </div>
    </div>

    <!-- Right: Dynamic Infinite Conditions Panel -->
    <div class="control-pane">
      <h2 id="simHeading" style="margin-top: 0; color: #fff; font-size: 1.2rem;">Simulation Parameters</h2>
      <p id="simDesc" style="color: var(--text-muted, #94a3b8); font-size: 0.85rem; margin-bottom: 24px; line-height: 1.4;"></p>

      <div class="metric-box">
        <div style="font-size: 0.75rem; color: #60a5fa; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">System Time (Cycles)</div>
        <div class="metric-value" id="cycleMetric">0</div>
      </div>

      <div id="controlsContainer"></div>
    </div>
  </div>

  <script type="module" src="simulator.js"></script>
</body>
</html>
