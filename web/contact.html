<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us — NoteCast</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<style>
  :root {
    --bg-main: #070a14;
    --bg-card: #0f172a;
    --border-color: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
  }

  * { box-sizing: border-box; }

  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
    line-height: 1.7;
  }

  header.site {
    background: rgba(7, 10, 20, 0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-color);
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
  }

  @media(min-width: 768px) {
    header.site { padding: 18px 48px; }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .brand img {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    object-fit: cover;
  }

  .brand-name {
    font-size: 1.45rem;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.03em;
  }

  .btn-outline {
    background: transparent;
    color: #f8fafc;
    border: 1px solid var(--border-color);
    padding: 9px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    transition: all 0.2s ease;
  }

  .btn-outline:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-solid {
    background: var(--accent-gradient);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    width: 100%;
    transition: opacity 0.2s ease;
  }

  .btn-solid:hover { opacity: 0.9; }

  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 140px 20px 80px;
  }

  h1 {
    font-size: 2.5rem;
    font-weight: 900;
    margin-bottom: 10px;
    letter-spacing: -0.03em;
  }

  p.lede {
    color: var(--text-muted);
    font-size: 1.05rem;
    margin-bottom: 40px;
  }

  .contact-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 0.88rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: #cbd5e1;
  }

  input, textarea {
    width: 100%;
    background: #070a14;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px 16px;
    color: white;
    font-size: 0.95rem;
    font-family: inherit;
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  footer {
    border-top: 1px solid var(--border-color);
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
    background: rgba(7, 10, 20, 0.9);
  }
</style>
</head>
<body>

  <header class="site">
    <a href="index.html" class="brand">
      <img src="assets/icon.png" alt="NoteCast Logo">
      <span class="brand-name">NoteCast</span>
    </a>
    <a href="index.html" class="btn-outline">&larr; Back to Home</a>
  </header>

  <main>
    <h1>Get in Touch</h1>
    <p class="lede">Have questions about our AI study notes, pricing plans, or enterprise academic accounts? Drop us a message below.</p>

    <div class="contact-card">
      <form onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent successfully.');">
        <div class="form-group">
          <label for="name">Your Full Name</label>
          <input type="text" id="name" required placeholder="Alex Johnson">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="alex@university.edu">
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" required placeholder="How can our support team help you today?"></textarea>
        </div>
        <button type="submit" class="btn-solid">Send Message</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 NoteCast. All rights reserved.</p>
  </footer>

</body>
</html>
