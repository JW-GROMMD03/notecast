<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | NoteCast Command Center</title>
    <style>
        :root {
            --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-muted: #64748b;
            --primary: #6366f1; --primary-hover: #4f46e5; --danger: #ef4444; --border: #e2e8f0;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --surface: #1e293b; --text: #f8fafc; --text-muted: #94a3b8;
            --border: #334155;
        }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: var(--surface); padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border: 1px solid var(--border); }
        .login-box h2 { margin: 0 0 8px 0; font-size: 24px; color: var(--primary); }
        .login-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        #errorMsg { color: var(--danger); font-size: 13px; margin-bottom: 16px; display: none; padding: 10px; background: rgba(239, 68, 68, 0.1); border-radius: 6px; }
        .lockout-timer { font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>NoteCast Admin</h2>
        <p>Secure Command Center Access</p>
        <div id="errorMsg"></div>
        <form id="adminLoginForm">
            <div class="form-group">
                <label>Administrator Email</label>
                <input type="email" id="email" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Master Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn" id="loginBtn">Authenticate</button>
        </form>
    </div>
    
    <script type="module">
        import { apiFetch } from "../api.js";

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');
            
            errorMsg.style.display = 'none';
            btn.textContent = "Verifying...";
            btn.disabled = true;

            try {
                // apiFetch automatically handles correct backend base URL routing
                const data = await apiFetch('/admin/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                if (data && data.access_token) {
                    localStorage.setItem('nc_admin_token', data.access_token);
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                errorMsg.style.display = 'block';
                if (err.status === 429) {
                    errorMsg.innerHTML = `Account locked due to multiple failed attempts. Try again later.`;
                } else {
                    errorMsg.textContent = `Error: ${err.message || 'Authentication failed'}`;
                }
            } finally {
                btn.textContent = "Authenticate";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
