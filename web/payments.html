<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — NoteCast</title>
<link rel="stylesheet" href="styles.css">
<style>
  :root {
    --bg-main: #070a14;
    --bg-card: #0f172a;
    --border-color: #1e293b;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
  }
  body {
    background-color: var(--bg-main);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 20px;
  }
  
  .top-nav {
    position: absolute;
    top: 24px;
    left: 24px;
  }
  .nav-back-link {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.2s;
  }
  .nav-back-link:hover { color: #fff; }

  .payment-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    box-sizing: border-box;
  }
  .payment-card h2 {
    margin-top: 0;
    color: #ffffff;
    font-size: 1.5rem;
  }
  .order-summary {
    background: rgba(59, 130, 246, 0.05);
    border: 1px solid rgba(59, 130, 246, 0.2);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .order-summary h4 { margin: 0; color: #f8fafc; font-size: 1rem; }
  .order-summary .price { font-size: 1.2rem; font-weight: 800; color: #3b82f6; }
  
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    margin-bottom: 8px;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  .form-group input {
    width: 100%;
    padding: 12px;
    background: #070a14;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: white;
    font-size: 1rem;
    box-sizing: border-box;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .btn-pay {
    width: 100%;
    background: #10b981;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    text-decoration: none;
    display: block;
    box-sizing: border-box;
  }
  .btn-pay:hover:not(:disabled) { background: #059669; }
  .btn-pay:disabled { opacity: 0.7; cursor: not-allowed; }
  
  .btn-outline {
    width: 100%;
    background: transparent;
    color: #f8fafc;
    border: 1px solid var(--border-color);
    padding: 14px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: block;
    transition: all 0.2s;
    box-sizing: border-box;
  }
  .btn-outline:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(59, 130, 246, 0.05);
  }

  .hidden { display: none !important; }
  .error-text { color: #ef4444; font-size: 0.85rem; margin-top: 8px; margin-bottom: 15px; }
  
  .polling-state { text-align: center; margin-top: 20px; }
  .spinner {
    display: inline-block; width: 24px; height: 24px;
    border: 3px solid rgba(255,255,255,0.3); border-radius: 50%;
    border-top-color: #fff; animation: spin 1s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .button-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 24px;
  }
</style>
</head>
<body>

  <div class="top-nav">
    <a href="dashboard.html" class="nav-back-link">← Back to Dashboard</a>
  </div>

  <div class="payment-card">
    <h2>Complete your purchase</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px;">Pay securely via M-Pesa STK Push.</p>
    
    <div class="order-summary">
      <div>
        <h4 id="planName">Loading Plan...</h4>
      </div>
      <div class="price" id="planPrice">-- KES</div>
    </div>

    <form id="paymentForm">
      <div class="form-group">
        <label for="phone">M-Pesa Phone Number</label>
        <input type="tel" id="phone" placeholder="0703250550" required autocomplete="tel">
      </div>
      
      <div id="paymentError" class="error-text hidden"></div>
      
      <button type="submit" id="payBtn" class="btn-pay">Pay Now</button>
      <a href="dashboard.html" class="btn-outline" style="margin-top: 12px;">Cancel & Return</a>
    </form>

    <div id="pollingUI" class="polling-state hidden">
      <div id="pollingStatus">
        <div class="spinner"></div>
        <h4 style="color: #ffffff; margin-top: 16px;">Check your phone</h4>
        <p style="color: var(--text-muted); font-size: 0.9rem;">An M-Pesa prompt has been sent to your phone. Enter your PIN to complete the transaction.</p>
      </div>

      <div id="actionButtons" class="button-group hidden">
        <a href="dashboard.html" class="btn-pay" style="background: #3b82f6;">Go to Dashboard</a>
        <a href="index.html#pricing" class="btn-outline">Return to Plans</a>
      </div>
    </div>
  </div>

  <script type="module" src="payments.js"></script>
</body>
</html>
