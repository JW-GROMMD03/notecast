<!-- web/reader/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoteCast Book Reader</title>
  <link rel="icon" type="image/png" href="/assets/icon.png">
  
  <style>
    body { 
      margin: 0; 
      background: #0f172a; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      overflow-y: auto; 
    }
    
    #pdf-render-container { 
      width: 100%; 
      max-width: 950px; 
      display: flex; 
      flex-direction: column; 
      align-items: center;
      padding: 30px 15px; 
    }
    
    canvas { 
      width: 100%; 
      background-color: #fff;
      border-radius: 8px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.8); 
    }
    
    .toolbar { 
      position: sticky; 
      top: 0; 
      background: #1e293b; 
      width: 100%; 
      padding: 12px 20px; 
      box-sizing: border-box;
      display: flex; 
      justify-content: center; 
      align-items: center;
      flex-wrap: wrap;
      gap: 16px; 
      z-index: 100; 
      color: #cbd5e1; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); 
      border-bottom: 1px solid #334155;
    }
    
    button { 
      background: #3b82f6; 
      color: white; 
      border: none; 
      padding: 8px 18px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 0.9rem;
      transition: background 0.2s, transform 0.1s;
    }
    
    button:hover:not(:disabled) {
      background: #2563eb;
    }
    
    button:disabled { 
      background: #475569; 
      color: #94a3b8;
      cursor: not-allowed; 
    }

    .btn-download {
      background: #10b981;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-download:hover:not(:disabled) {
      background: #059669;
    }
    
    .page-info {
      align-self: center;
      font-weight: 500;
      font-size: 0.95rem;
    }

    /* Loader */
    .loader {
      border: 4px solid #1e293b;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-top: 20vh;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <!-- Mozilla PDF.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>

<body>

  <div class="toolbar">
    <button id="prev-page" disabled>← Previous</button>
    <span class="page-info">Page: <span id="page-num" style="color: #38bdf8; font-weight: 700;">-</span> / <span id="page-count">-</span></span>
    <button id="next-page" disabled>Next →</button>
    <button id="download-book" class="btn-download" disabled>⬇ Download PDF</button>
  </div>

  <div id="pdf-render-container">
    <div id="loading-spinner" class="loader"></div>
    <canvas id="pdf-render" style="display: none;"></canvas>
  </div>

  <script type="module">
    import { authedFetch } from "/assets/js/api.js";

    const urlParams = new URLSearchParams(window.location.search);
    const bookId = urlParams.get('bookId');

    if (!bookId) {
      alert("No book selected.");
      window.close();
    }

    // Configure PDF.js Web Worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfDoc = null,
        pageNum = 1,
        pageIsRendering = false,
        pageNumIsPending = null;

    const canvas = document.getElementById('pdf-render'),
          ctx = canvas.getContext('2d'),
          spinner = document.getElementById('loading-spinner'),
          downloadBtn = document.getElementById('download-book');

    const renderPage = num => {
      pageIsRendering = true;
      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale: 1.8 });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderCtx = { canvasContext: ctx, viewport: viewport };
        
        page.render(renderCtx).promise.then(() => {
          pageIsRendering = false;
          
          if (pageNumIsPending !== null) {
            renderPage(pageNumIsPending);
            pageNumIsPending = null;
          }
        });
        
        document.getElementById('page-num').textContent = num;
        document.getElementById('prev-page').disabled = (num <= 1);
        document.getElementById('next-page').disabled = (num >= pdfDoc.numPages);
      });
    };

    const queueRenderPage = num => {
      if (pageIsRendering) pageNumIsPending = num;
      else renderPage(num);
    };

    document.getElementById('prev-page').addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
      window.scrollTo(0, 0);
    });

    document.getElementById('next-page').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
      window.scrollTo(0, 0);
    });

    // Download watermarked PDF for offline keeping
    downloadBtn.addEventListener('click', async () => {
      const originalLabel = downloadBtn.textContent;
      downloadBtn.disabled = true;
      downloadBtn.textContent = "Preparing PDF...";

      try {
        const token = localStorage.getItem("access_token") || localStorage.getItem("token") || "";
        const headers = token ? { "Authorization": `Bearer ${token}` } : {};

        const response = await fetch(`/books/${bookId}/download`, {
          method: "GET",
          credentials: "include",
          headers: headers
        });

        if (!response.ok) {
          let errMsg = "Download failed.";
          try {
            const errJson = await response.json();
            if (errJson.detail) errMsg = errJson.detail;
          } catch (_) {}
          throw new Error(errMsg);
        }

        // Extract filename from Content-Disposition header if available
        const disposition = response.headers.get("Content-Disposition") || "";
        const match = disposition.match(/filename="?([^"]+)"?/);
        const filename = match ? match[1] : `NoteCast_Book_${bookId}.pdf`;

        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(blobUrl);
      } catch (err) {
        alert(err.message || "Could not download the book. Please try again.");
      } finally {
        downloadBtn.disabled = false;
        downloadBtn.textContent = originalLabel;
      }
    });

    // Initialize the Viewer
    async function initReader() {
      try {
        const res = await authedFetch(`/books/${bookId}/read-url`);
        const data = res.json ? await res.json() : res;

        if (!data.url) throw new Error("Could not retrieve secure URL.");

        const loadingTask = pdfjsLib.getDocument(data.url);
        pdfDoc = await loadingTask.promise;
        
        document.getElementById('page-count').textContent = pdfDoc.numPages;
        spinner.style.display = "none";
        canvas.style.display = "block";
        downloadBtn.disabled = false;
        
        renderPage(pageNum);
      } catch(err) {
        spinner.style.display = "none";
        alert("Failed to load book. Make sure you are authenticated and have purchased access.");
        window.close();
      }
    }

    initReader();
  </script>
</body>
</html>
