<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account — NoteCast</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<style>
  :root { --brand: #6366f1; --brand-hover: #4f46e5; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
  .site-header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; font-size: 1.2rem; color: var(--text); }
  .brand img { width: 32px; border-radius: 8px; }
  .nav-links { display: flex; gap: 20px; align-items: center; font-size: 0.9rem; font-weight: 600; }
  .nav-links a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: var(--brand); }
  .btn-outline { padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px; color: var(--text); text-decoration: none; }
  .btn-outline:hover { border-color: var(--brand); color: var(--brand); }
  
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .auth-card { background: var(--surface); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 420px; border: 1px solid var(--border); }
  .auth-card h1 { margin: 0 0 8px 0; font-size: 1.75rem; letter-spacing: -0.02em; }
  .lede { color: var(--text-muted); margin: 0 0 30px 0; font-size: 0.95rem; line-height: 1.5; }
  
  .field-group { margin-bottom: 20px; }
  .field-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text); }
  .field-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; box-sizing: border-box; transition: border-color 0.2s; }
  .field-group input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
  
  .password-field { position: relative; }
  .toggle-visibility { position: absolute; right: 12px; top: 12px; background: none; border: none; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); cursor: pointer; }
  
  .strength-meter { height: 4px; background: #e2e8f0; border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .bar { height: 100%; width: 0; transition: all 0.3s ease; }
  .strength-hint { font-size: 0.75rem; font-weight: 600; margin-top: 6px; }
  .field-error { color: #ef4444; font-size: 0.8rem; margin-top: 6px; font-weight: 500; }
  
  .primary.full { width: 100%; background: var(--brand); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .primary.full:hover { background: var(--brand-hover); }
  .primary.full:disabled { opacity: 0.7; cursor: not-allowed; }
  
  .switch-row { margin-top: 24px; text-align: center; font-size: 0.9rem; color: var(--text-muted); }
  .link-btn { color: var(--brand); font-weight: 600; text-decoration: none; }
  .link-btn:hover { text-decoration: underline; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand">
      <img src="assets/icon.png" alt="NoteCast Logo"> NoteCast
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html" class="btn-outline">Sign in</a>
    </div>
  </header>

  <main>
    <div class="auth-card">
      <div id="formView">
        <h1>Create your account</h1>
        <p class="lede">Turn any video into verified study notes in clicks.</p>

        <form id="signupForm" novalidate>
          <div class="field-group">
            <label for="displayName">Name</label>
            <input id="displayName" type="text" required autocomplete="name" maxlength="60" autofocus />
          </div>

          <div class="field-group">
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="email" />
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <div class="password-field">
              <input id="password" type="password" required autocomplete="new-password" minlength="8" />
              <button type="button" class="toggle-visibility" id="togglePw">Show</button>
            </div>
            <div class="strength-meter"><div class="bar" id="strengthBar"></div></div>
            <div class="strength-hint" id="strengthHint"></div>
          </div>

          <div class="field-group">
            <label for="confirmPassword">Confirm password</label>
            <div class="password-field">
              <input id="confirmPassword" type="password" required autocomplete="new-password" />
              <button type="button" class="toggle-visibility" id="toggleConfirm">Show</button>
            </div>
            <p id="matchError" class="field-error hidden">Passwords don't match.</p>
          </div>

          <button type="submit" id="submitBtn" class="primary full">Create account</button>
          <p id="formError" class="field-error hidden" style="text-align: center; margin-top:16px;"></p>
        </form>

        <div class="switch-row">
          Already have an account? <a href="login.html" class="link-btn">Sign in</a>
        </div>
      </div>

      <div id="successView" class="hidden" style="text-align: center;">
        <h1 style="margin-bottom: 16px;">Check your email</h1>
        <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 30px;">
          We've sent a verification link to <strong id="sentEmail" style="color: var(--text);"></strong>. Click it to activate your account.
        </p>
        <a href="login.html" class="primary full" style="text-decoration: none; display: inline-block; box-sizing: border-box;">Return to Sign in</a>
      </div>
    </div>
  </main>

  <script type="module" src="signup.js"></script>
</body>
</html>
