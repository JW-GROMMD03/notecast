<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academic Book Library — NoteCast Studio</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="stylesheet" href="styles.css">
<style>
  :root {
    --bg-main: #070a14;
    --bg-card: #0f172a;
    --border-color: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; }
  body { background-color: var(--bg-main); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; }
  
  .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; }
  .back-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.88rem; }

  .admin-upload-card { background: rgba(59, 130, 246, 0.05); border: 1px dashed var(--accent); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
  .filters-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .filter-group { display: flex; flex-direction: column; gap: 6px; }
  .filter-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
  .input-box { padding: 10px 14px; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 0.9rem; width: 100%; }

  .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
  .book-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
  .book-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  
  .book-cover-container { width: 100%; height: 260px; background: #1e293b; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .book-cover-container img { width: 100%; height: 100%; object-fit: cover; }
  .book-badge { position: absolute; top: 10px; right: 10px; background: rgba(59, 130, 246, 0.9); color: white; padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; z-index: 2; }

  .book-info { padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .book-title { font-size: 1rem; font-weight: 700; margin: 0 0 4px 0; color: var(--text-main); }
  .book-meta { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px; }
  .book-desc { font-size: 0.85rem; color: #cbd5e1; line-height: 1.4; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  
  .btn-action { width: 100%; background: var(--accent); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; display: block; font-size: 0.88rem; }
  .btn-pay-access { background: linear-gradient(135deg, #059669 0%, #047857 100%); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
</style>
</head>
<body>

  <div class="header-bar">
    <div>
      <h1 style="margin: 0; font-size: 1.5rem;">Academic Book Library (Cloudflare R2)</h1>
      <p style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 0.88rem;">Filter textbooks, upload documents with custom covers, and unlock access.</p>
    </div>
    <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
  </div>

  <!-- Admin Upload Section -->
  <div class="admin-upload-card">
    <h3 style="margin-top: 0; color: var(--accent); font-size: 1.1rem;">📤 Admin: Upload Book, Cover & Details</h3>
    <form id="adminBookUploadForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px;">
      <div class="filter-group"><label>Book Title</label><input type="text" id="uploadTitle" class="input-box" required></div>
      <div class="filter-group"><label>Course</label><input type="text" id="uploadCourse" class="input-box" placeholder="Software_Engineering" required></div>
      <div class="filter-group"><label>Unit</label><input type="text" id="uploadUnit" class="input-box" placeholder="Distributed_Systems" required></div>
      <div class="filter-group"><label>Topic</label><input type="text" id="uploadTopic" class="input-box" placeholder="Raft" required></div>
      <div class="filter-group"><label>Price (KES)</label><input type="number" id="uploadPrice" class="input-box" value="150" required></div>
      <div class="filter-group" style="grid-column: 1 / -1;"><label>Detailed Description</label><textarea id="uploadDescription" class="input-box" rows="2" placeholder="Summary of chapters, objectives, etc." required></textarea></div>
      <div class="filter-group"><label>Document File (PDF / DOCX)</label><input type="file" id="uploadFilePdf" accept=".pdf,.doc,.docx" class="input-box" style="padding: 6px;" required></div>
      <div class="filter-group"><label>Cover Page Image (PNG / JPG)</label><input type="file" id="uploadCoverImage" accept="image/*" class="input-box" style="padding: 6px;"></div>
      <div style="grid-column: 1 / -1; display: flex; justify-content: flex-end;">
        <button type="submit" id="uploadBookBtn" class="btn-action" style="max-width: 200px;">Publish to R2</button>
      </div>
    </form>
  </div>

  <!-- Filters Toolbar -->
  <div class="filters-card">
    <div class="filter-group">
      <label>Filter by Course</label>
      <select id="filterCourse" class="input-box">
        <option value="">All Courses</option>
        <option value="Software_Engineering">Software Engineering</option>
        <option value="Database_Management">Database Management</option>
        <option value="Cybersecurity">Cybersecurity & Defense</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Filter by Unit</label>
      <input type="text" id="filterUnit" class="input-box" placeholder="e.g. Distributed_Systems">
    </div>
    <div class="filter-group">
      <label>Sort By</label>
      <select id="sortOrder" class="input-box">
        <option value="latest">Latest Additions</option>
        <option value="popular">Most Popular</option>
      </select>
    </div>
  </div>

  <!-- Books Grid -->
  <div id="booksGrid" class="books-grid">
    <!-- Populated dynamically from backend -->
  </div>

  <script type="module">
    import { authedFetch } from "./api.js";

    let allBooks = [];

    async function fetchBooks() {
      try {
        const res = await authedFetch("/books/");
        let data = res;
        if (res.json) data = await res.json();
        allBooks = Array.isArray(data) ? data : [];
        renderBooks(allBooks);
      } catch (err) {
        console.error("Failed to load books from backend", err);
      }
    }

    function renderBooks(books) {
      const grid = document.getElementById("booksGrid");
      if (!books.length) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No books available in the library.</div>`;
        return;
      }

      grid.innerHTML = books.map(b => `
        <div class="book-card">
          <div>
            <div class="book-cover-container">
              <span class="book-badge">KES ${b.price}</span>
              ${b.cover_url ? `<img src="${b.cover_url}" alt="${b.title}">` : `<div style="font-size: 3rem;">📖</div>`}
            </div>
            <div class="book-info">
              <div>
                <h3 class="book-title">${b.title}</h3>
                <div class="book-meta">Course: ${b.course?.replace(/_/g, " ")}<br>Unit: ${b.unit?.replace(/_/g, " ")}</div>
                <p class="book-desc">${b.description || 'No description provided.'}</p>
              </div>
            </div>
          </div>
          <div style="padding: 0 16px 16px 16px;">
            <button onclick="window.openPaymentModal('ECONOMY_NOTE', '${b.price} KES')" class="btn-action btn-pay-access">Pay to Access (KES ${b.price})</button>
          </div>
        </div>
      `).join("");
    }

    document.getElementById("adminBookUploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("uploadBookBtn");
      btn.disabled = true;
      btn.textContent = "Uploading files...";

      const formData = new FormData();
      formData.append("title", document.getElementById("uploadTitle").value.trim());
      formData.append("course", document.getElementById("uploadCourse").value.trim());
      formData.append("unit", document.getElementById("uploadUnit").value.trim());
      formData.append("topic", document.getElementById("uploadTopic").value.trim());
      formData.append("price", document.getElementById("uploadPrice").value.trim());
      formData.append("description", document.getElementById("uploadDescription").value.trim());
      formData.append("file", document.getElementById("uploadFilePdf").files[0]);
      
      const coverFile = document.getElementById("uploadCoverImage").files[0];
      if (coverFile) {
        formData.append("cover_file", coverFile);
      }

      try {
        const res = await authedFetch("/admin/books/upload/", {
          method: "POST",
          body: formData
        });
        if (!res.ok) throw new Error("Upload failed.");
        alert("Book successfully uploaded and published!");
        document.getElementById("adminBookUploadForm").reset();
        fetchBooks();
      } catch (err) {
        alert("Failed to upload book. Check console for details.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Publish to R2";
      }
    });

    fetchBooks();
  </script>
</body>
</html>
