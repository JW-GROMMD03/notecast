<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academic Book Library — NoteCast Studio</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="stylesheet" href="styles.css">
<style>
  :root {
    --bg-main: #070a14;
    --bg-card: #0f172a;
    --border-color: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; }
  body { background-color: var(--bg-main); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; }
  
  .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; }
  .back-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.88rem; }

  /* Filters Toolbar */
  .filters-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .filter-group { display: flex; flex-direction: column; gap: 6px; }
  .filter-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
  .input-box { padding: 10px 14px; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 0.9rem; }

  /* Books Grid Layout */
  .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
  .book-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
  .book-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  
  .book-cover-container { width: 100%; height: 280px; background: #1e293b; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .book-cover-container img { width: 100%; height: 100%; object-fit: cover; }
  .book-badge { position: absolute; top: 10px; right: 10px; background: rgba(59, 130, 246, 0.9); color: white; padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }

  .book-info { padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .book-title { font-size: 1rem; font-weight: 700; margin: 0 0 6px 0; color: var(--text-main); }
  .book-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; }
  
  .btn-pay-access { width: 100%; background: linear-gradient(135deg, #059669 0%, #047857 100%); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; display: block; font-size: 0.88rem; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
  .btn-pay-access:hover { opacity: 0.95; }
</style>
</head>
<body>

  <div class="header-bar">
    <div>
      <h1 style="margin: 0; font-size: 1.5rem;">Academic Book Library</h1>
      <p style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 0.88rem;">Filter textbooks by course, unit, and topic.</p>
    </div>
    <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
  </div>

  <!-- Filters Toolbar -->
  <div class="filters-card">
    <div class="filter-group">
      <label>Filter by Course</label>
      <select id="filterCourse" class="input-box">
        <option value="">All Courses</option>
        <option value="Software_Engineering">Software Engineering</option>
        <option value="Database_Management">Database Management</option>
        <option value="Cybersecurity">Cybersecurity & Defense</option>
        <option value="Artificial_Intelligence">Artificial Intelligence</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Filter by Unit</label>
      <select id="filterUnit" class="input-box">
        <option value="">All Units</option>
        <option value="Distributed_Systems">Distributed Systems</option>
        <option value="Data_Pipelines">Data Pipelines & ETL</option>
        <option value="Cryptography">Applied Cryptography</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Filter by Topic</label>
      <input type="text" id="filterTopic" class="input-box" placeholder="e.g. Raft, SQL, Encryption">
    </div>

    <div class="filter-group">
      <label>Sort By</label>
      <select id="sortOrder" class="input-box">
        <option value="latest">Latest Additions</option>
        <option value="popular">Most Popular</option>
        <option value="rating">Highest Rated</option>
      </select>
    </div>
  </div>

  <!-- Books Grid -->
  <div id="booksGrid" class="books-grid">
    <!-- Populated dynamically -->
  </div>

  <script type="module">
    import { authedFetch } from "./api.js";

    const MOCK_BOOKS = [
      { id: "b1", title: "Distributed Systems Architecture", course: "Software_Engineering", unit: "Distributed_Systems", topic: "Raft & Paxos", popularity: 98, date: "2026-09-01", price: 150, cover: "assets/covers/distributed.png" },
      { id: "b2", title: "Modern Data Engineering & Pipelines", course: "Database_Management", unit: "Data_Pipelines", topic: "ETL & Spark", popularity: 95, date: "2026-10-15", price: 200, cover: "assets/covers/data.png" },
      { id: "b3", title: "Applied Cryptography & Network Security", course: "Cybersecurity", unit: "Cryptography", topic: "TLS & RSA", popularity: 90, date: "2026-08-10", price: 180, cover: "assets/covers/crypto.png" },
      { id: "b4", title: "Large Language Models & Agentic Workflows", course: "Artificial_Intelligence", unit: "Distributed_Systems", topic: "LangChain", popularity: 99, date: "2026-11-01", price: 250, cover: "assets/covers/ai.png" }
    ];

    function renderBooks(books) {
      const grid = document.getElementById("booksGrid");
      if (!books.length) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No books match your selected filters.</div>`;
        return;
      }

      grid.innerHTML = books.map(b => `
        <div class="book-card">
          <div>
            <div class="book-cover-container">
              <span class="book-badge">KES ${b.price}</span>
              <div style="font-size: 3rem;">📖</div>
            </div>
            <div class="book-info">
              <div>
                <h3 class="book-title">${b.title}</h3>
                <div class="book-meta">Course: ${b.course.replace(/_/g, " ")}<br>Unit: ${b.unit.replace(/_/g, " ")}</div>
              </div>
            </div>
          </div>
          <div style="padding: 0 16px 16px 16px;">
            <button onclick="window.openPaymentModal('ECONOMY_NOTE', '${b.price} KES')" class="btn-pay-access">Pay to Access (KES ${b.price})</button>
          </div>
        </div>
      `).join("");
    }

    function applyFilters() {
      let filtered = [...MOCK_BOOKS];
      const course = document.getElementById("filterCourse").value;
      const unit = document.getElementById("filterUnit").value;
      const topic = document.getElementById("filterTopic").value.toLowerCase();
      const sort = document.getElementById("sortOrder").value;

      if (course) filtered = filtered.filter(b => b.course === course);
      if (unit) filtered = filtered.filter(b => b.unit === unit);
      if (topic) filtered = filtered.filter(b => b.topic.toLowerCase().includes(topic));

      if (sort === "popular") filtered.sort((a, b) => b.popularity - a.popularity);
      else if (sort === "latest") filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

      renderBooks(filtered);
    }

    document.getElementById("filterCourse").addEventListener("change", applyFilters);
    document.getElementById("filterUnit").addEventListener("change", applyFilters);
    document.getElementById("filterTopic").addEventListener("input", applyFilters);
    document.getElementById("sortOrder").addEventListener("change", applyFilters);

    renderBooks(MOCK_BOOKS);
  </script>
</body>
</html>
