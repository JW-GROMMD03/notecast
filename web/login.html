<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — NoteCast</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<style>
  :root { --brand: #6366f1; --brand-hover: #4f46e5; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
  .site-header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; font-size: 1.2rem; color: var(--text); }
  .brand img { width: 32px; border-radius: 8px; }
  .nav-links { display: flex; gap: 20px; align-items: center; font-size: 0.9rem; font-weight: 600; }
  .nav-links a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: var(--brand); }
  .btn-outline { padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px; color: var(--text); text-decoration: none; background: transparent; cursor: pointer; transition: border-color 0.2s; }
  .btn-outline:hover { border-color: var(--brand); color: var(--brand); }
  
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .auth-card { background: var(--surface); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 420px; border: 1px solid var(--border); }
  .auth-card h1 { margin: 0 0 8px 0; font-size: 1.75rem; letter-spacing: -0.02em; }
  .lede { color: var(--text-muted); margin: 0 0 30px 0; font-size: 0.95rem; line-height: 1.5; }
  
  .field-group { margin-bottom: 20px; }
  .field-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text); }
  .field-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; box-sizing: border-box; transition: border-color 0.2s; }
  .field-group input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
  
  .password-field { position: relative; }
  .toggle-visibility { position: absolute; right: 12px; top: 12px; background: none; border: none; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); cursor: pointer; }
  .field-error { color: #ef4444; font-size: 0.85rem; margin-top: 16px; font-weight: 500; text-align: center; }
  
  .primary.full { width: 100%; background: var(--brand); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
  .primary.full:hover { background: var(--brand-hover); }
  .primary.full:disabled { opacity: 0.7; cursor: not-allowed; }
  
  .switch-row { margin-top: 24px; display: flex; justify-content: space-between; font-size: 0.9rem; }
  .link-btn { color: var(--brand); font-weight: 600; text-decoration: none; }
  .link-btn:hover { text-decoration: underline; }
  .hidden { display: none !important; }

  /* Google Button Styles */
  .google-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 24px; color: var(--text); }
  .divider { display: flex; align-items: center; text-align: center; color: var(--text-muted); margin-bottom: 24px; font-size: 0.85rem; font-weight: 500; }
  .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
  .divider span { padding: 0 14px; }
</style>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand">
      <img src="assets/icon.png" alt="NoteCast Logo"> NoteCast
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="signup.html" class="btn-outline" style="background: var(--brand); color: white; border: none;">Create account</a>
    </div>
  </header>

  <main>
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="lede">Sign in to access your video study notes.</p>

      <!-- Google Sign In -->
      <button type="button" id="googleBtn" class="btn-outline google-btn">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>

      <div class="divider">
        <span>or sign in with email</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="field-group">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="email" autofocus />
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" type="password" required autocomplete="current-password" />
            <button type="button" class="toggle-visibility" id="toggleBtn">Show</button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="primary full">Sign in</button>
        <p id="formError" class="field-error hidden"></p>
      </form>

      <div class="switch-row">
        <a href="forgot-password.html" class="link-btn" style="color: var(--text-muted);">Forgot password?</a>
        <a href="signup.html" class="link-btn">Create an account</a>
      </div>
    </div>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
