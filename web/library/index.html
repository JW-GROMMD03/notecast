<!-- web/library/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Books — NoteCast Studio</title>
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  :root {
    --bg-main: #070a14;
    --bg-card: #0f172a;
    --border-color: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg-main); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; }
  .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .back-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.88rem; }
  .filters { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .input-box { padding: 10px 14px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 0.9rem; flex: 1; min-width: 200px; }
  .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
  .book-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .book-card:hover { border-color: var(--accent); }
  .cover { width: 100%; height: 260px; background: #1e293b; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .info { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .title { font-size: 1rem; font-weight: 700; margin: 0; }
  .meta { font-size: 0.78rem; color: var(--text-muted); }
  .btn { margin-top: auto; background: #10b981; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.88rem; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px; }
</style>
</head>
<body>

  <div class="header-bar">
    <div>
      <h1 style="margin: 0; font-size: 1.5rem;">My Books</h1>
      <p style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 0.88rem;">Books you have purchased. Read them online anytime.</p>
    </div>
    <a href="/dashboard" class="back-btn">← Back to Dashboard</a>
  </div>

  <div class="filters">
    <input id="searchBox" class="input-box" placeholder="Search your books by title, course or unit...">
  </div>

  <div id="booksGrid" class="books-grid"><div class="empty">Loading your books...</div></div>

  <script type="module">
    import { authedFetch } from "/assets/js/api.js";

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let books = [];

    async function load() {
      const grid = document.getElementById("booksGrid");
      try {
        const res = await authedFetch("/books/my-library");
        const data = res.json ? await res.json() : res;
        books = Array.isArray(data) ? data : [];
        render();
      } catch (e) {
        grid.innerHTML = `<div class="empty" style="color:#ef4444;">Failed to load your books. Please sign in again.</div>`;
      }
    }

    function render() {
      const q = document.getElementById("searchBox").value.trim().toLowerCase();
      const list = books.filter(b => !q || `${b.title} ${b.course} ${b.unit}`.toLowerCase().includes(q));
      const grid = document.getElementById("booksGrid");

      if (!list.length) {
        grid.innerHTML = `<div class="empty">${books.length ? "No matching books." : "You haven't bought any books yet. Open the Book Store on your dashboard to get started."}</div>`;
        return;
      }

      grid.innerHTML = list.map(b => `
        <div class="book-card">
          <div class="cover">
            ${b.cover_url ? `<img src="${b.cover_url}" alt="" onerror="this.onerror=null;this.src='/assets/icon.png'">` : `<div style="font-size:3rem;">📖</div>`}
          </div>
          <div class="info">
            <h3 class="title">${esc(b.title)}</h3>
            <div class="meta">${esc((b.course || "").replace(/_/g, " "))} | ${esc((b.unit || "").replace(/_/g, " "))}</div>
            <button class="btn" data-id="${b.id}">Read Now</button>
          </div>
        </div>`).join("");
    }

    document.getElementById("booksGrid").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-id]");
      if (btn) window.open(`/reader?bookId=${encodeURIComponent(btn.dataset.id)}`, "_blank");
    });
    document.getElementById("searchBox").addEventListener("input", render);

    load();
  </script>
</body>
</html>
