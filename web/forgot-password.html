<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password — NoteCast</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<style>
  :root { --brand: #6366f1; --brand-hover: #4f46e5; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
  .site-header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; font-size: 1.2rem; color: var(--text); }
  .brand img { width: 32px; border-radius: 8px; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .auth-card { background: var(--surface); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 420px; border: 1px solid var(--border); text-align: center; }
  .auth-card h1 { margin: 0 0 8px 0; font-size: 1.75rem; letter-spacing: -0.02em; }
  .lede { color: var(--text-muted); margin: 0 0 30px 0; font-size: 0.95rem; line-height: 1.5; }
  .field-group { margin-bottom: 20px; text-align: left; }
  .field-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text); }
  .field-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; box-sizing: border-box; transition: border-color 0.2s; }
  .field-group input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
  .primary.full { width: 100%; background: var(--brand); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
  .primary.full:hover { background: var(--brand-hover); }
  .primary.full:disabled { opacity: 0.7; cursor: not-allowed; }
  .field-error { color: #ef4444; font-size: 0.85rem; margin-top: 16px; font-weight: 500; }
  .back-link { display: inline-block; margin-top: 24px; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
  .back-link:hover { color: var(--text); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand"><img src="assets/icon.png" alt="NoteCast Logo"> NoteCast</a>
    <div style="font-weight: 600;"><a href="index.html" style="color: var(--text-muted); text-decoration: none;">Home</a></div>
  </header>

  <main>
    <div class="auth-card">
      <div id="formView">
        <h1>Reset your password</h1>
        <p class="lede">Enter the email on your account and we'll send you a link to reset your password.</p>

        <form id="forgotForm" novalidate>
          <div class="field-group">
            <label for="email">Email address</label>
            <input id="email" type="email" required autocomplete="email" autofocus />
          </div>
          <button type="submit" id="submitBtn" class="primary full">Send reset link</button>
          <p id="formError" class="field-error hidden"></p>
        </form>
        <a href="login.html" class="back-link">&larr; Back to sign in</a>
      </div>

      <div id="successView" class="hidden">
        <h1>Check your email</h1>
        <p class="lede" style="margin-bottom: 30px; color: var(--text);">
          If an account exists for that email, a reset link is on its way. Check your spam folder if you don't see it.
        </p>
        <a href="login.html" class="primary full" style="text-decoration: none; display: inline-block; box-sizing: border-box;">Return to Sign in</a>
      </div>
    </div>
  </main>
  <script type="module" src="forgot-password.js"></script>
</body>
</html>
