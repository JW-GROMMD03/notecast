<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your notes — NoteCast</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site">
    <a href="dashboard.html" class="brand">
      <img src="assets/icon.png" alt="NoteCast Logo">
      <span class="brand-name">NoteCast</span>
    </a>
    <div class="user-menu">
      <span id="userName" style="font-weight: 600; color: var(--ink);"></span>
      <button id="logoutBtn" class="link-btn">Sign out</button>
    </div>
  </header>

  <main>
    <h1>Your notes</h1>
    <p class="lede">Every video NoteCast has captured, newest first. Start a new one from the extension while watching on YouTube.</p>

    <ul id="videoList" class="video-list"></ul>
    <div id="emptyState" class="empty-state hidden">
      No videos yet. Open a video on YouTube and click <strong>Start NoteCast</strong> in the extension side panel.
    </div>
  </main>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
